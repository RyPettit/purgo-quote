<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Your Purgō invoice</title>
<meta name="theme-color" content="#132f47">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="preload" href="fonts/plus-jakarta-sans.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Plus Jakarta Sans";src:url("fonts/plus-jakarta-sans.woff2") format("woff2");font-weight:200 800;font-display:swap}
:root{--navy:#132f47;--ocean:#326986;--sky:#6da7c4;--mist:#c6e1ef;--soft:#e2eff7;--bg:#eef5f9;--line:#d4e4ee;--muted:#53708a;--good:#1f7a4d;--good-bg:#e3f3ea;--bad:#b3362c;--bad-bg:#fbeceb;--warn:#a86411;--warn-bg:#fdf3e4}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--navy);font:15px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:linear-gradient(90deg,#132f47,#326986);padding:14px 18px}
header .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;color:#fff}
header img.em{height:34px}header img.wm{height:22px}
header .tel{margin-left:auto;color:#fff;text-decoration:none;font-weight:600;font-size:.9rem;border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:6px 14px}
main{max-width:760px;margin:0 auto;padding:18px 16px 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
h1{font-size:1.5rem;letter-spacing:-.02em;margin:0 0 2px}
.sub{color:var(--muted);margin:0}
.banner{border-radius:10px;padding:12px 14px;margin-bottom:16px;font-weight:600}
.banner.good{background:var(--good-bg);color:var(--good)}.banner.bad{background:var(--bad-bg);color:var(--bad)}.banner.warn{background:var(--warn-bg);color:var(--warn)}
.quote{overflow-x:auto}
.quote>div{max-width:none!important}
.quote [data-accept]{display:none}
.btn{font:inherit;font-weight:700;border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:999px;padding:11px 20px;cursor:pointer}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn:disabled{opacity:.55;cursor:default}
.btn.big{font-size:1.05rem;padding:14px 26px;width:100%}
label{display:block;font-size:.85rem;font-weight:600;color:var(--muted);margin:12px 0 4px}
input,textarea{width:100%;font:inherit;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#f7fbfd;color:var(--navy)}
input:focus,textarea:focus{outline:2px solid var(--sky);outline-offset:1px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.links{display:flex;gap:18px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.link{background:none;border:0;font:inherit;color:var(--ocean);text-decoration:underline;cursor:pointer;padding:4px}
.err{color:var(--bad);font-weight:600;margin:10px 0 0}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:6px 0 4px}
.total b{font-size:1.6rem}
.fine{color:var(--muted);font-size:.85rem;margin:10px 0 0}
.pick{margin:12px 0 4px}
.pick h2{font-size:1rem;margin:0 0 4px}
.sec{display:flex;align-items:center;gap:12px;margin:8px 0 0;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:1rem;font-weight:600;color:var(--navy);cursor:pointer;background:#f7fbfd}
.sec input{width:22px;height:22px;flex:0 0 22px;margin:0;accent-color:var(--navy)}
.sec span{flex:1}.sec b{font-variant-numeric:tabular-nums}
.sec:has(input:not(:checked)){background:#fff;color:var(--muted)}
.sec:has(input:not(:checked)) b{text-decoration:line-through}
footer{text-align:center;color:var(--muted);font-size:.85rem;margin-top:24px}
@media print{header .tel,.actions,.noprint{display:none!important}body{background:#fff}.card{border:0;padding:0}}
.inv{overflow-x:auto}
.bank{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.bank h2{font-size:1rem;margin:0 0 4px}
@media print{.paycard{display:none!important}}
</style>
</head>
<body>
<header><div class="in"><img class="em" src="brand/emblem-light.png" alt=""><img class="wm" src="brand/wordmark-light.png" alt="purgō"><a class="tel" href="tel:07930877034">07930 877034</a></div></header>
<main>
  <div id="loading" class="card"><p class="sub">Loading your invoice…</p></div>
  <div id="oops" class="card" hidden><h1>Sorry</h1><p id="oopsMsg"></p><p class="sub">You can call us on <a href="tel:07930877034">07930 877034</a>.</p></div>
  <div id="page" hidden>
    <div id="banner" class="banner" hidden></div>
    <section class="card paycard" id="payCard">
      <div class="total"><span id="dueLbl">To pay</span><b id="due"></b></div>
      <p class="sub" id="dueTxt"></p>
      <div class="row" id="cardRow" hidden><button class="btn pri big" type="button" id="payBtn">Pay by card</button></div>
      <p class="fine" id="cardTxt" hidden>Secure card payment by Stripe. Apple Pay and Google Pay work too.</p>
      <p class="err" id="payErr" hidden></p>
      <div class="bank" id="bank" hidden><h2>Pay by bank transfer</h2><div id="bankBody"></div><p class="fine">Please use the reference so we can match your payment.</p></div>
      <div class="links noprint"><button class="link" type="button" onclick="print()">Print or save as PDF</button></div>
    </section>
    <section class="card inv" id="inv"></section>
    <p class="fine" id="foot" style="text-align:center"></p>
  </div>
  <footer>Purgō, family run exterior cleaning · <a href="https://www.purgo-clean.com">www.purgo-clean.com</a></footer>
</main>
<script src="config.js"></script>
<script>
(()=>{
  const $ = id => document.getElementById(id);
  const CFG = window.PURGO_CONFIG || {};
  const qs = new URLSearchParams(location.search), token = qs.get('t') || '', justPaid = qs.get('paid') === '1';
  const gbp = n => '£' + (Math.round((+n||0)*100)/100).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});
  const day = s => new Date(s + 'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
  async function call(action){
    const r = await fetch(CFG.url + '/functions/v1/invoicing', {method:'POST', headers:{'Content-Type':'application/json', apikey:CFG.key}, body: JSON.stringify({action, token})});
    const j = await r.json().catch(()=>({error:'Something went wrong. Please try again.'}));
    if(!r.ok || j.error) throw new Error(j.error || 'Something went wrong. Please try again.');
    return j;
  }
  function banner(cls, t){ const b = $('banner'); b.className = 'banner ' + cls; b.textContent = t; b.hidden = false; }
  function render(I){
    $('loading').hidden = true; $('page').hidden = false;
    document.title = `Purgō invoice ${I.ref}`;
    $('inv').innerHTML = I.html;
    $('foot').textContent = I.footer || '';
    if(I.status === 'void'){ banner('bad', 'This invoice has been cancelled, so there is nothing to pay.'); $('payCard').hidden = true; return; }
    if(I.due <= 0){ banner('good', 'Paid in full. Thank you!'); $('payCard').hidden = true; return; }
    if(justPaid) banner('good', 'Thank you, your card payment has gone through. It can take a minute to show here.');
    else if(I.overdue) banner('warn', `This invoice was due on ${day(I.dueDate)}.`);
    $('due').textContent = gbp(I.due);
    $('dueLbl').textContent = I.paid > 0 ? 'Left to pay' : 'To pay';
    $('dueTxt').textContent = `Invoice ${I.ref} · due by ${day(I.dueDate)}`;
    $('cardRow').hidden = $('cardTxt').hidden = !I.canPayCard || justPaid;
    if(I.bank){ $('bank').hidden = false; $('bankBody').innerHTML = I.bank; }
  }
  $('payBtn').onclick = async ()=>{
    const b = $('payBtn'); b.disabled = true; b.textContent = 'Opening secure payment…'; $('payErr').hidden = true;
    try{ const r = await call('pay'); location.href = r.url; }
    catch(e){ b.disabled = false; b.textContent = 'Pay by card'; $('payErr').hidden = false; $('payErr').textContent = e.message; }
  };
  (async ()=>{
    try{ render(await call('view')); if(justPaid) setTimeout(async ()=>{ try{ render(await call('view')); }catch(e){} }, 6000); }
    catch(e){ $('loading').hidden = true; $('oops').hidden = false; $('oopsMsg').textContent = e.message; }
  })();
})();
</script>
</body>
</html>
