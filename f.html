<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>How did we do?</title>
<meta name="theme-color" content="#132f47">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="preload" href="fonts/plus-jakarta-sans.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Plus Jakarta Sans";src:url("fonts/plus-jakarta-sans.woff2") format("woff2");font-weight:200 800;font-display:swap}
:root{--navy:#132f47;--ocean:#326986;--sky:#6da7c4;--soft:#e2eff7;--bg:#eef5f9;--line:#d4e4ee;--muted:#53708a;--good:#1f7a4d;--good-bg:#e3f3ea;--bad:#b3362c;--star:#f2b01e}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--navy);font:16px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:linear-gradient(90deg,#132f47,#326986);padding:14px 18px}
header .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;color:#fff}
header img.em{height:34px}header img.wm{height:22px}
header .tel{margin-left:auto;color:#fff;text-decoration:none;font-weight:600;font-size:.9rem;border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:6px 14px}
main{max-width:560px;margin:0 auto;padding:22px 16px 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:16px;text-align:center}
h1{font-size:1.5rem;letter-spacing:-.02em;margin:0 0 6px}
p{margin:0 0 10px}.sub{color:var(--muted)}
.stars{display:flex;justify-content:center;gap:6px;margin:16px 0 6px}
.stars button{background:none;border:0;font-size:44px;line-height:1;cursor:pointer;color:#cdd9e2;padding:2px;transition:transform .1s}
.stars button.on{color:var(--star)}
.stars button:active{transform:scale(.9)}
.btn{display:inline-block;font:inherit;font-weight:700;border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:999px;padding:13px 24px;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.big{width:100%;font-size:1.05rem;margin-top:10px}
.btn:disabled{opacity:.55;cursor:default}
textarea{width:100%;font:inherit;border:1px solid var(--line);border-radius:10px;padding:12px;background:#f7fbfd;color:var(--navy);margin-top:12px;min-height:96px}
.err{color:var(--bad);font-weight:600;margin-top:10px}
.done{background:var(--good-bg);color:var(--good);border-radius:10px;padding:12px 14px;font-weight:600;margin-top:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:12px}
footer{text-align:center;color:var(--muted);font-size:.85rem;margin-top:24px}
</style>
</head>
<body>
<header><div class="in"><img class="em" src="brand/emblem-light.png" alt=""><img class="wm" src="brand/wordmark-light.png" alt="purgō"><a class="tel" id="tel" href="#" hidden></a></div></header>
<main>
  <div id="loading" class="card"><p class="sub">Loading…</p></div>
  <div id="oops" class="card" hidden><h1>Sorry</h1><p id="oopsMsg"></p></div>

  <!-- review request -->
  <section id="review" class="card" hidden>
    <h1 id="rvTitle">How did we do?</h1>
    <p class="sub" id="rvSub"></p>
    <div class="stars" id="stars" role="radiogroup" aria-label="Your rating out of 5"></div>
    <p class="sub" id="starHint">Tap the stars</p>
    <div id="rvMore" hidden>
      <textarea id="rvComment" placeholder="Anything you'd like to tell us? (optional)"></textarea>
      <button class="btn pri big" type="button" id="rvSend">Send</button>
    </div>
    <p class="err" id="rvErr" hidden></p>
    <div id="rvThanks" hidden>
      <p class="done" id="rvThanksMsg"></p>
      <div id="rvGoogle" hidden>
        <p>Would you mind sharing that on Google? It really helps a small local business like ours.</p>
        <button class="btn pri big" type="button" id="rvGoogleBtn">Leave a Google review</button>
      </div>
      <div class="row" id="share" hidden><button class="btn" type="button" id="shareBtn">Recommend us to a friend</button></div>
    </div>
  </section>

  <!-- due again / win-back -->
  <section id="book" class="card" hidden>
    <h1 id="bkTitle"></h1>
    <p class="sub" id="bkSub"></p>
    <textarea id="bkNote" placeholder="Any days that suit, or anything else we should know? (optional)"></textarea>
    <button class="btn pri big" type="button" id="bkYes">Yes please, get in touch</button>
    <div class="row"><button class="btn" type="button" id="bkNo">No thanks, not right now</button></div>
    <p class="err" id="bkErr" hidden></p>
    <p class="done" id="bkDone" hidden></p>
  </section>
  <footer id="foot"></footer>
</main>
<script src="config.js"></script>
<script>
(()=>{
  const $ = id => document.getElementById(id);
  const CFG = window.PURGO_CONFIG || {};
  const token = new URLSearchParams(location.search).get('t') || '';
  async function call(action, extra){
    const r = await fetch(CFG.url + '/functions/v1/reminders', {method:'POST', headers:{'Content-Type':'application/json', apikey:CFG.key}, body: JSON.stringify(Object.assign({action, token}, extra || {}))});
    const j = await r.json().catch(()=>({error:'Something went wrong. Please try again.'}));
    if(!r.ok || j.error) throw new Error(j.error || 'Something went wrong. Please try again.');
    return j;
  }
  let D = null, rating = 0;
  function head(){
    if(D.phone){ const t = $('tel'); t.hidden = false; t.textContent = D.phone; t.href = 'tel:' + D.phone.replace(/[^\d+]/g, ''); }
    $('foot').textContent = [D.business, D.website].filter(Boolean).join(' · ');
  }
  function drawStars(){
    $('stars').innerHTML = [1,2,3,4,5].map(n => `<button type="button" role="radio" aria-checked="${n===rating}" aria-label="${n} star${n>1?'s':''}" data-n="${n}" class="${n<=rating?'on':''}">★</button>`).join('');
    $('stars').querySelectorAll('button').forEach(b => b.onclick = () => { rating = +b.dataset.n; drawStars(); pick(); });
  }
  function pick(){
    $('rvMore').hidden = false;
    $('starHint').textContent = ['', 'Sorry to hear that', 'Sorry to hear that', 'Thanks', 'Thank you!', 'Brilliant, thank you!'][rating];
    $('rvComment').placeholder = rating <= 3 ? 'What should we have done better? We read every message and will get in touch.' : 'Anything you\'d like to tell us? (optional)';
  }
  function thanks(google){
    $('stars').hidden = $('starHint').hidden = $('rvMore').hidden = true;
    $('rvThanks').hidden = false;
    $('rvThanksMsg').textContent = rating >= 4 ? 'Thank you, that means a lot to us.' : 'Thank you for telling us. We\'ll be in touch to put it right.';
    $('rvGoogle').hidden = !google;
    $('share').hidden = rating < 4;
  }
  $('rvSend').onclick = async () => {
    const b = $('rvSend'); b.disabled = true; b.textContent = 'Sending…'; $('rvErr').hidden = true;
    try{ const r = await call('fb_rate', {rating, comment:$('rvComment').value}); thanks(r.google); }
    catch(e){ b.disabled = false; b.textContent = 'Send'; $('rvErr').hidden = false; $('rvErr').textContent = e.message; }
  };
  $('rvGoogleBtn').onclick = async () => { try{ const r = await call('fb_google'); if(r.url) location.href = r.url; }catch(e){} };
  $('shareBtn').onclick = async () => {
    const text = `I use ${D.business} and they're great.${D.phone ? ' Call ' + D.phone : ''}${D.website ? ' or see ' + D.website : ''}`;
    try{ if(navigator.share){ await navigator.share({text}); return; } }catch(e){ return; }
    location.href = 'https://wa.me/?text=' + encodeURIComponent(text);
  };
  async function reply(answer){
    $('bkYes').disabled = $('bkNo').disabled = true; $('bkErr').hidden = true;
    try{
      await call('mk_reply', {answer, note:$('bkNote').value});
      $('bkYes').hidden = $('bkNo').hidden = $('bkNote').hidden = true;
      $('bkDone').hidden = false;
      $('bkDone').textContent = answer === 'yes' ? 'Thank you! We\'ll be in touch soon to agree a date.' : 'No problem, thanks for letting us know.';
    }catch(e){ $('bkYes').disabled = $('bkNo').disabled = false; $('bkErr').hidden = false; $('bkErr').textContent = e.message; }
  }
  $('bkYes').onclick = () => reply('yes');
  $('bkNo').onclick = () => reply('no');
  (async () => {
    try{
      D = await call('fb_view'); head();
      $('loading').hidden = true;
      if(D.kind === 'review'){
        $('review').hidden = false; document.title = `How did ${D.business} do?`;
        $('rvTitle').textContent = `How did we do${D.name ? ', ' + D.name : ''}?`;
        $('rvSub').textContent = D.service ? `Your ${D.service} from ${D.business}` : `Your visit from ${D.business}`;
        if(D.rating){ rating = D.rating; drawStars(); thanks(D.google); $('rvThanksMsg').textContent = 'Thanks, you\'ve already told us how we did.'; }
        else drawStars();
      } else {
        $('book').hidden = false; document.title = D.business;
        $('bkTitle').textContent = D.kind === 'repeat' ? `Time for your ${D.service || 'clean'} again${D.name ? ', ' + D.name : ''}?` : `Can we help with anything${D.name ? ', ' + D.name : ''}?`;
        $('bkSub').textContent = D.kind === 'repeat' ? `Tap yes and ${D.business} will get in touch to agree a date. No commitment until then.` : `Tap yes and ${D.business} will get in touch. Windows, gutters, roofs, driveways and more.`;
        if(D.response){ $('bkYes').hidden = $('bkNo').hidden = $('bkNote').hidden = true; $('bkDone').hidden = false; $('bkDone').textContent = D.response === 'yes' ? 'Thanks, we\'ve got your request and will be in touch.' : 'Thanks for letting us know.'; }
      }
    }catch(e){ $('loading').hidden = true; $('oops').hidden = false; $('oopsMsg').textContent = e.message; }
  })();
})();
</script>
</body>
</html>
